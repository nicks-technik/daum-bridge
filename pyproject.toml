[project]
name = "daum-bridge"
version = "0.0.9"
description = "Bridge Daum 8008 TRS RS232 ergometer to MyWhoosh via BLE FTMS (Linux focused)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5",
    "ruamel.yaml>=0.18.6",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "dbus-next>=0.2.3",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "bluez-peripheral>=0.1.7",
]

[project.scripts]
daum-bridge = "daum_bridge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.6.0",
    "pytest-cov>=4.1.0",
]
