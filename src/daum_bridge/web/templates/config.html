<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daum-bridge - Config</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
        .header { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); padding: 20px 40px; }
        .header h1 { margin: 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 30px 20px; }
        .section { background: #1e293b; padding: 25px; border-radius: 10px; margin-bottom: 25px; border: 1px solid #334155; }
        .section h2 { margin: 0 0 20px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; }
        button { padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .back { color: #3b82f6; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚙️ Configuration</h1>
        <a href="/" class="back">← Back to Dashboard</a>
    </div>
    <div class="container">
        <div class="section">
            <h2>Serial</h2>
            <div class="form-group">
                <label>Port (leave empty for auto-detect)</label>
                <input type="text" id="serialPort" placeholder="/dev/ttyUSB0 or COM3">
            </div>
            <div class="form-group">
                <label>Baudrate</label>
                <select id="baudrate">
                    <option value="9600">9600</option>
                    <option value="19200">19200</option>
                </select>
            </div>
        </div>
        <div class="section">
            <h2>BLE</h2>
            <div class="form-group">
                <label>Device Name</label>
                <input type="text" id="bleName" value="DAUM-8008-TRS">
            </div>
            <div class="form-group">
                <label>Adapter</label>
                <input type="text" id="adapter" value="hci0">
            </div>
        </div>
        <div class="section">
            <h2>Logging</h2>
            <div class="form-group">
                <label><input type="checkbox" id="logRaw" style="width: auto;"> Log raw frames</label>
            </div>
        </div>
        <button onclick="save()">Save Config</button>
        <p style="color: #94a3b8; margin-top: 15px;">Note: Restart the bridge for changes to take effect.</p>
    </div>
    <script>
        async function load() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if (data.serial) document.getElementById('serialPort').value = data.serial.port || '';
                if (data.serial) document.getElementById('baudrate').value = data.serial.baudrate;
                if (data.ble) document.getElementById('bleName').value = data.ble.device_name || 'DAUM-8008-TRS';
                if (data.ble) document.getElementById('adapter').value = data.ble.adapter || 'hci0';
                if (data.logging) document.getElementById('logRaw').checked = !!data.logging.log_raw_frames;
            } catch(e) {}
        }
        async function save() {
            try {
                const data = {
                    serial: {
                        port: document.getElementById('serialPort').value || null,
                        baudrate: parseInt(document.getElementById('baudrate').value)
                    },
                    ble: {
                        device_name: document.getElementById('bleName').value,
                        adapter: document.getElementById('adapter').value
                    },
                    logging: {
                        log_raw_frames: document.getElementById('logRaw').checked
                    }
                };
                const res = await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.ok) {
                    alert('Config saved. Restart required for some changes.');
                } else {
                    alert('Error: ' + (result.error || 'unknown'));
                }
            } catch(e) {
                alert('Error: ' + e);
            }
        }
        load();
    </script>
</body>
</html>
