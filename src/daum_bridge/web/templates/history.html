<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daum-bridge - Ride History</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
        .header { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); padding: 20px 40px; }
        .header h1 { margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }
        .nav { margin-bottom: 20px; }
        .nav a { color: #3b82f6; text-decoration: none; margin-right: 15px; }
        .card { background: #1e293b; padding: 25px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; font-weight: 600; }
        .stat { display: inline-block; margin-right: 20px; }
        .stat-label { color: #94a3b8; font-size: 12px; }
        .stat-value { font-size: 18px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚴 Ride History</h1>
    </div>
    <div class="container">
        <div class="nav">
            <a href="/">← Dashboard</a>
            <a href="/logs">Logs</a>
            <a href="/config">Config</a>
        </div>
        <div class="card">
            <h2>Recent Rides</h2>
            <table id="ridesTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Duration</th>
                        <th>Distance</th>
                        <th>Avg Power</th>
                        <th>Max Power</th>
                        <th>Work (kJ)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <p id="noRides" style="color: #94a3b8; display: none;">No rides recorded yet.</p>
        </div>
    </div>
    <script>
        function fmtTime(s) {
            const h = Math.floor(s/3600);
            const m = Math.floor((s%3600)/60);
            const sec = Math.floor(s%60);
            return h>0?`${h}h ${m}m ${sec}s`:`${m}m ${sec}s`;
        }
        async function load() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                const tbody = document.querySelector('#ridesTable tbody');
                tbody.innerHTML = '';
                if (!data.rides || data.rides.length === 0) {
                    document.getElementById('noRides').style.display = 'block';
                    return;
                }
                document.getElementById('noRides').style.display = 'none';
                for (const ride of data.rides.reverse()) {
                    const tr = document.createElement('tr');
                    const date = new Date((ride.start || Date.now()/1000) * 1000).toLocaleString();
                    tr.innerHTML = `<td>${date}</td><td>${fmtTime(ride.duration||0)}</td><td>${(ride.distance||0).toFixed(1)} km</td><td>${(ride.avg_power||0).toFixed(0)} W</td><td>${(ride.max_power||0).toFixed(0)} W</td><td>${(ride.work_kj||0).toFixed(1)} kJ</td>`;
                    tbody.appendChild(tr);
                }
            } catch(e) {}
        }
        load();
    </script>
</body>
</html>
