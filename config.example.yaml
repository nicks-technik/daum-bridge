# daum-bridge configuration
# Copy to config.yaml and adjust for your setup

serial:
  # Leave empty for auto-detect
  port: ""
  baudrate: 9600
  timeout: 1.0
  # Bytesize/parity/stopbits - Daum 8008 TRS typically uses RS232 defaults; try 9600 8N1
  bytesize: 8
  parity: "N"
  stopbits: 1

bridge:
  poll_interval: 0.5  # seconds for run_Data polling
  reconnect_delay: 2.0
  # Highest gear used when FTMS/FE-C resistance is translated to Daum gears.
  max_gear: 30

sim:
  # Free-ride ("simulation") mode: apps such as MyWhoosh send a road grade
  # instead of a target power. The Daum has no incline motor, so the bridge
  # turns the cockpit's speed + the grade into a target power and lets the
  # brake hold it. These are the rider/bike constants of that power model.
  enabled: true
  rider_mass_kg: 80
  bike_mass_kg: 9
  crr: 0.004              # rolling resistance coefficient (road tyre)
  cw: 0.51                # drag area Cd * A in m^2
  max_grade_percent: 16   # grades are clamped to this value
  power_scale: 1.0        # <1 = easier free ride, >1 = harder

ble:
  enabled: true
  adapter: "hci0"  # BlueZ adapter
  device_name: "DAUM-8008-TRS"
  # Publish the FTMS Heart Rate Service so the training app sees the heart
  # rate the bridge reads from the belt (see heart_rate below).
  advertise_heart_rate: true
  # FTMS service/characteristics handled internally

heart_rate:
  # Read a BLE heart-rate belt with the bridge (central role) instead of
  # pairing it in the training app. The value is written to the ride file
  # (TCX) and republished through the FTMS Heart Rate Service, so MyWhoosh
  # still shows it. The belt must not be connected to the app at the same
  # time - a strap accepts only one central.
  enabled: false
  # BLE address or part of the advertised name; empty = first strap found.
  device: ""
  # Adapter to scan with; empty = use ble.adapter.
  adapter: ""
  scan_timeout: 30        # seconds to look for the belt
  reconnect_delay: 5      # seconds between reconnect attempts

ant:
  # Broadcast as an ANT+ FE-C trainer (device type 17) in addition to BLE.
  # Requires the optional openant package: uv sync --extra ant
  enabled: false
  # ANT device number (0 = automatic). Also settable via DAUM_ANT_DEVICE_ID.
  device_id: 0
  # Optional hex override of the ANT+ public network key, e.g.
  # "B9 A5 21 FB BD 72 C3 45" (default when empty).
  network_key: ""

web:
  enabled: true
  host: "0.0.0.0"
  port: 8080

input:
  # Handlebar shift buttons (wired GPIO or Bluetooth HID).
  # Requires the optional extras: uv sync --extra gpio --extra input
  enabled: false
  # none | gpio | evdev | both
  backend: "both"
  # Leave ERG mode when a button shifts, so the gear actually changes the load.
  shift_clears_erg: true
  # Hold a button to keep shifting: first repeat after 0.45 s, then every 0.12 s.
  repeat_delay: 0.45
  repeat_interval: 0.12
  # Minimum time between two shifts (protects the 9600 baud serial link).
  min_interval: 0.10
  gpio:
    # BCM17 = physical pin 11, BCM27 = physical pin 13, common ground on pin 9/14.
    up_pin: 17
    down_pin: 27
    bounce_time: 0.05
    active_low: true   # button to GND with the internal pull-up
  evdev:
    # /dev/input/by-id/... or "name:<substring>"; empty = auto-detect.
    device: ""
    up_key: "KEY_VOLUMEUP"
    down_key: "KEY_VOLUMEDOWN"

strava:
  # Upload rides automatically when they finish (uses saved credentials).
  auto_upload: false
  # Upload activities as private (only visible to you).
  private: false
  # Strava API application credentials: https://www.strava.com/settings/api
  # Alternatively set STRAVA_CLIENT_ID / STRAVA_CLIENT_SECRET.
  client_id: ""
  client_secret: ""
  # Obtain with: uv run daum-bridge strava-auth --write-config
  # (or export STRAVA_REFRESH_TOKEN). The refresh token is required.
  refresh_token: ""
  # Refreshed access tokens are cached here (add to .gitignore).
  token_file: "strava.tokens.json"
  # How long to wait for Strava to process an upload (seconds).
  poll_timeout: 120

email:
  # Email each finished ride as a TCX attachment.
  auto_send: false
  # SMTP server (e.g. smtp.gmail.com). Alternatively set DAUM_EMAIL_* vars.
  host: ""
  port: 587          # 587 = STARTTLS, 465 = implicit SSL
  username: ""
  password: ""       # use an app password for Gmail
  from_addr: ""
  to_addr: ""        # comma-separated recipients allowed
  use_tls: true      # STARTTLS
  use_ssl: false     # implicit TLS (set true for port 465)
  subject_prefix: "Daum training"

logging:
  level: "INFO"
  log_raw_frames: false
